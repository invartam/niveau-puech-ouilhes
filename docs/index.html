<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niv'eau - Puech des Ouilhes</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#007bff">
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #fff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #ccc;
      --btn-bg: #fff;
      --btn-active-bg: #007bff;
      --btn-active-text: #fff;
      --shadow: rgba(0,0,0,0.1);
      --chart-grid: #e0e0e0;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #e0e0e0;
      --text-secondary: #aaa;
      --border: #333;
      --btn-bg: #0f3460;
      --btn-active-bg: #007bff;
      --btn-active-text: #fff;
      --shadow: rgba(0,0,0,0.3);
      --chart-grid: #333;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: var(--text); }
    .controls { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .controls button { padding: 8px 16px; border: 1px solid var(--border); background: var(--btn-bg); color: var(--text); cursor: pointer; border-radius: 4px; transition: background 0.2s; }
    .controls button.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--btn-active-bg); }
    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px var(--shadow); margin-bottom: 20px; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 150px; }
    .stat .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
    .stat .value { font-size: 24px; font-weight: bold; }
    .threshold { color: #dc3545; }
    canvas { max-height: 500px; }
    .theme-toggle { margin-left: auto; padding: 8px 12px; border: 1px solid var(--border); background: var(--btn-bg); color: var(--text); cursor: pointer; border-radius: 4px; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌊 Niveau d'eau - Puech des Ouilhes</h1>
    <p>Lac de barrage de Saint-Étienne-Cantalès (Cantal)</p>

    <div class="card">
      <div class="stats">
        <div class="stat">
          <div class="label">Niveau actuel</div>
          <div class="value" id="currentLevel">--</div>
        </div>
        <div class="stat">
          <div class="label">Dernière mesure</div>
          <div class="value" id="lastTs" style="font-size:16px">--</div>
        </div>
        <div class="stat">
          <div class="label">Seuil haut (alerte)</div>
          <div class="value threshold">498 mNGF</div>
        </div>
        <div class="stat">
          <div class="label">Seuil bas (alerte)</div>
          <div class="value threshold">501 mNGF</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <button data-period="24h" class="active">24 h</button>
        <button data-period="7d">7 jours</button>
        <button data-period="30d">30 jours</button>
        <button data-period="365d">1 an</button>
        <button id="resetZoom">Réinitialiser le zoom</button>
        <button class="theme-toggle" id="themeToggle" title="Changer de thème">🌙</button>
      </div>
      <canvas id="levelChart"></canvas>
    </div>
  </div>

  <script>
    const THRESHOLD_HIGH = 498;
    const THRESHOLD_LOW = 501;
    let chart = null;
    let currentPeriod = '24h';

    async function loadData(period) {
      const res = await fetch(`data/${period}.json`);
      const json = await res.json();
      return json.points;
    }

    async function loadLatest() {
      try {
        const res = await fetch('data/latest.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        document.getElementById('currentLevel').textContent = json.value + ' mNGF';
        document.getElementById('lastTs').textContent = json.ts;
      } catch(e) {
        console.error('loadLatest error:', e);
        document.getElementById('currentLevel').textContent = 'Erreur';
      }
    }

    function renderChart(points) {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const labels = points.map(p => p.ts);
      const minData = points.map(p => p.min);
      const maxData = points.map(p => p.max);
      const avgData = points.map(p => p.avg);

      // Compute dynamic Y scale with margin
      const allVals = [...minData, ...maxData, ...avgData, THRESHOLD_HIGH, THRESHOLD_LOW];
      const dataMin = Math.min(...allVals);
      const dataMax = Math.max(...allVals);
      const margin = Math.max(1, (dataMax - dataMin) * 0.1);
      const yMin = Math.floor(dataMin - margin);
      const yMax = Math.ceil(dataMax + margin);

      const ctx = document.getElementById('levelChart').getContext('2d');
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Niveau (moy.)',
              data: avgData,
              borderColor: '#007bff',
              backgroundColor: 'rgba(0,123,255,0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: 2,
            },
            {
              label: 'Min',
              data: minData,
              borderColor: '#28a745',
              borderDash: [5,5],
              pointRadius: 0,
              fill: false,
            },
            {
              label: 'Max',
              data: maxData,
              borderColor: '#dc3545',
              borderDash: [5,5],
              pointRadius: 0,
              fill: false,
            },
            {
              label: 'Seuil haut (498)',
              data: labels.map(() => THRESHOLD_HIGH),
              borderColor: 'red',
              borderWidth: 2,
              pointRadius: 0,
              fill: false,
            },
            {
              label: 'Seuil bas (501)',
              data: labels.map(() => THRESHOLD_LOW),
              borderColor: 'orange',
              borderWidth: 2,
              pointRadius: 0,
              fill: false,
            },
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: {
              title: { display: true, text: 'Date/Heure', color: isDark ? '#e0e0e0' : '#1a1a1a' },
              ticks: {
                maxTicksLimit: 12,
                color: isDark ? '#e0e0e0' : '#666',
                callback: function(value, index, ticks) {
                  const label = this.getLabelForValue(value);
                  if (!label) return '';
                  const d = new Date(label);
                  return d.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
                }
              },
              grid: { color: isDark ? '#333' : '#e0e0e0' }
            },
            y: {
              title: { display: true, text: 'mNGF', color: isDark ? '#e0e0e0' : '#1a1a1a' },
              ticks: { color: isDark ? '#e0e0e0' : '#666' },
              grid: { color: isDark ? '#333' : '#e0e0e0' },
              min: yMin,
              max: yMax,
            }
          },
          plugins: {
            zoom: {
              zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
              pan: { enabled: true, mode: 'x' },
            },
            legend: { position: 'top' },
          }
        }
      });
    }

    async function init() {
      await loadLatest();
      const points = await loadData(currentPeriod);
      renderChart(points);
    }

    document.querySelectorAll('.controls button[data-period]').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.controls button[data-period]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPeriod = btn.dataset.period;
        const points = await loadData(currentPeriod);
        renderChart(points);
      });
    });

    document.getElementById('resetZoom').addEventListener('click', () => {
      if (chart) chart.resetZoom();
    });

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
      // Update chart colors
      if (chart) {
        const isDark = next === 'dark';
        chart.options.scales.x.ticks.color = isDark ? '#e0e0e0' : '#666';
        chart.options.scales.y.ticks.color = isDark ? '#e0e0e0' : '#666';
        chart.options.scales.x.title.color = isDark ? '#e0e0e0' : '#1a1a1a';
        chart.options.scales.y.title.color = isDark ? '#e0e0e0' : '#1a1a1a';
        chart.update();
      }
    });

    init();
  </script>
</body>
</html>
