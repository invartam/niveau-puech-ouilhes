name: Fetch water levels

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Force full backfill (30d/365d)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/levels.db
          key: levels-db-${{ github.ref }}
          restore-keys: |
            levels-db-

      - name: Run fetch script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python scripts/fetch_levels.py --backfill

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data/alert_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update water level data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4